<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ACCESS</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- HEADER -->

  <header>

<a
  href="index.html"
  class="logo"
  data-site="restaurantName"
></a>


    <nav>

      <a href="index.html#about">
        ABOUT
      </a>

      <a href="menu.html">
        MENU
      </a>

      <a href="plan.html">
        PLAN
      </a>

      <a href="access.html">
        ACCESS
      </a>

    </nav>


    <button
      class="menu-toggle"
      aria-label="メニューを開く"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>


    <a
      href="index.html#reservation"
      class="reservation-button"
    >
      RESERVATION
    </a>

  </header>



  <!-- ACCESS -->

  <section class="access-page">

    <div class="menu-page-title">

      <p class="section-subtitle">
        ACCESS
      </p>

      <h1>
        ACCESS
      </h1>

      <a
        href="index.html"
        class="back-home"
      >
        ← BACK TO HOME
      </a>

    </div>


    <div class="access">

      <p>
        <span data-site="address"></span>
      </p>

      <p>
        TEL：
        <span data-site="phone"></span>
      </p>

      <p>
        OPEN：
        <span data-site="openHours"></span>
      </p>

      <p>
        <span data-site="closedDay"></span>
      </p>


      <div class="map">

        <iframe
          id="map"
          width="100%"
          height="400"
          style="border:0;"
          allowfullscreen=""
          loading="lazy"
        ></iframe>

      </div>

    </div>

  </section>



  <!-- RESERVATION -->

  <section class="reservation">

    <p class="section-subtitle">
      RESERVATION
    </p>

    <h2>
      BOOK YOUR TABLE
    </h2>

    <a
      href="#"
      class="reservation-button large"
      data-link="reservationUrl"
    >
      WEB RESERVATION
    </a>

  </section>



  <!-- FOOTER -->

  <footer>

    <p data-site="restaurantName"></p>

  </footer>



  <script src="config.js"></script>

  <script src="script.js"></script>


</body>

</html>
