<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>THANK YOU</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
  <link rel="icon" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  

</head>


<body>


  <header>

    <a
      href="index.html"
      class="logo"
      data-site="restaurantName"
    ></a>

  </header>


  <section class="thanks-page">

    <div class="menu-page-title">

      <p class="section-subtitle">
        RESERVATION
      </p>

      <h1>
        THANK YOU
      </h1>

    </div>


    <div class="thanks-message">

      <h2>
        ご予約ありがとうございます。
      </h2>

      <p>
        ご予約内容を受け付けました。
      </p>

      <p>
        確認のうえ、担当者よりご連絡いたします。
      </p>


      <a
        href="index.html"
        class="menu-more"
      >
        BACK TO HOME
      </a>

    </div>

  </section>


  <footer>

    <p data-site="restaurantName"></p>

    <p data-site="address"></p>

    <p>
      TEL：
      <a href="#" data-phone>
        <span data-site="phone"></span>
      </a>
    </p>

    <p>
      EMAIL：
      <a href="#" data-email>
        <span data-site="email"></span>
      </a>
    </p>

    <p>
      <a
        data-link="instagram"
        target="_blank"
      >
        Instagram
      </a>
    </p>

    <p>
      © 2026
      <span data-site="restaurantName"></span>
    </p>

  </footer>


  <script src="config.js"></script>
  <script src="script.js"></script>


</body>

</html>
